  '@carbon/feature-flags': true
  '@carbon/grid': true
  '@carbon/icon-helpers': true
  '@carbon/icons-react': true
  '@carbon/layout': true
  '@carbon/motion': true
  '@carbon/react': true
  '@carbon/styles': true
  '@carbon/themes': true
  '@carbon/type': true
  '@carbon/utilities': true
  '@ibm/plex': true
  '@ibm/plex-mono': true
  '@ibm/plex-sans': true
  '@ibm/plex-sans-arabic': true
  '@ibm/plex-sans-devanagari': true
  '@ibm/plex-sans-hebrew': true
  '@ibm/plex-sans-thai': true
  '@ibm/plex-sans-thai-looped': true
  '@ibm/plex-serif': true
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

catalog:
  '@changesets/cli': 3.0.3
  '@faker-js/faker': 10.6.0
  '@types/lodash-es': 4.17.12
  '@types/chrome': 0.3.7
  husky: 9.1.7
  lint-staged: 17.6.0
  lodash-es: 4.18.1
  oxfmt: 0.76.0
  rxjs: 7.8.2
  sass: 1.107.1
  style-dictionary: 5.8.0
  tslib: 2.9.1
  type-fest: 5.10.0
  verdaccio: 7.0.2
  zod: 4.6.7
  zone.js: 0.16.3
  esbuild: 0.28.2
  '@modelcontextprotocol/sdk': 1.32.2
  '@types/chroma-js': 3.1.3
  axios: 1.21.0
  chroma-js: 3.2.0
  reset-css: 5.0.2
  p-limit: 7.3.3
  playwright: 1.65.0

catalogs:
  angular-latest:
    '@angular-devkit/build-angular': 22.2.6
    '@angular/animations': 22.2.4
    '@angular/cli': 22.2.6
    '@angular/common': 22.2.4
    '@angular/compiler': 22.2.4
    '@angular/compiler-cli': 22.2.4
    '@angular/core': 22.2.4
    '@angular/forms': 22.2.4
    '@angular/platform-browser': 22.2.4
    '@angular/platform-browser-dynamic': 22.2.4
    '@angular/router': 22.2.4
    angular-eslint: 22.6.0
    ng-packagr: 22.2.6
  eslint-latest:
    '@typescript-eslint/utils': 8.72.1
    eslint: 10.14.0
    typescript-eslint: 8.72.1
  oxlint-latest:
    oxlint: 1.90.0
    oxlint-tsgolint: 7.0.2006
  react-latest:
    '@emotion/react': 11.14.0
    '@emotion/styled': 11.14.1
    '@mui/icons-material': 9.5.0
    '@mui/material': 9.5.0
    '@tanstack/react-table': 9.3.1
    '@types/react': 19.3.0
    '@types/react-dom': 19.3.0
    '@vitejs/plugin-react-swc': 4.3.3
    '@vitejs/plugin-react': 6.2.1
    babel-plugin-react-compiler: 1.0.0
    oxc-transform-react: 0.156.0
    react: 19.3.1
    react-dom: 19.3.1
  carbon-latest:
    '@carbon/react': 1.120.0
  turbo-latest:
    '@turbo/gen': 2.11.10
    turbo: 2.11.10
  typescript-latest:
    '@types/node': 26.6.6
    '@typescript/native': npm:typescript@7.0.2
    typescript: npm:@typescript/typescript6@6.0.2
  vite-latest:
    '@vitest/browser-playwright': 5.1.0
    '@vitest/coverage-v8': 5.1.0
    vite: 8.3.6
    vite-plugin-dts: 5.1.2
    vitest: 5.1.0
  storybook-latest:
    '@chromatic-com/storybook': 5.6.0
    '@storybook/addon-a11y': 10.6.6
    '@storybook/addon-docs': 10.6.6
    '@storybook/addon-onboarding': 10.6.6
    '@storybook/addon-vitest': 10.6.6
    '@storybook/react-vite': 10.6.6
    storybook: 10.6.6

overrides:
  # angular-eslint depends on `@typescript-eslint/utils@^8.0.0`, which pnpm resolved to 8.46.3. That
  # version crashes under ESLint 10 ("Class extends value undefined"). Keep it in step with
  # typescript-eslint.
  '@typescript-eslint/utils': 'catalog:eslint-latest'

minimumReleaseAgeExclude:
  - '@angular-devkit/architect@0.2202.6'
  - '@angular-devkit/build-angular@22.2.6'
  - '@angular-devkit/build-webpack@0.2202.6'
  - '@angular-devkit/core@22.2.6'
  - '@angular-devkit/schematics@22.2.6'
  - '@angular/build@22.2.6'
  - '@angular/cli@22.2.6'
  - '@ngtools/webpack@22.2.6'
  - '@schematics/angular@22.2.6'
  - vite@8.3.6
  - '@oxlint-tsgolint/darwin-arm64@7.0.2006'
  - '@oxlint-tsgolint/darwin-x64@7.0.2006'
  - '@oxlint-tsgolint/linux-arm64@7.0.2006'
  - '@oxlint-tsgolint/linux-x64@7.0.2006'
  - '@oxlint-tsgolint/win32-arm64@7.0.2006'
  - '@oxlint-tsgolint/win32-x64@7.0.2006'
  - oxlint-tsgolint@7.0.2006
