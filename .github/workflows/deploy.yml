name: Node.js CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install
        run: pnpm i --frozen-lockfile

      # The Storybook tests run in Playwright's Chromium, which `pnpm i` doesn't download.
      - name: Install Playwright's Chromium
        run: pnpm --filter nam-ui-react-storybook exec playwright install --with-deps --only-shell chromium

      - name: Check formatting, linting, types and tests
        run: pnpm ci-checks

      # What CI drew for a picture that didn't match, with the difference, to compare with the reference.
      - name: Upload the pictures of failed visual tests
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: failed-visual-tests
          path: apps/nam-ui-react-storybook/.vitest/attachments
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: pnpm turbo build --filter=main-site

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: main-site-dist
          path: apps/main-site/dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages

      - name: Clear branch contents
        run: |
          git rm -rf .
          git clean -fxd
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          name: main-site-dist

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update branch by replacing all contents with latest artifacts"
          git push
